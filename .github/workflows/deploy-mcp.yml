name: Deploy MCP Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/src/mcp.ts"
      - "worker/src/env.ts"
      - "worker/mcp-entry.ts"
      - "worker/wrangler-mcp.toml"
      - "worker/package.json"
      - "worker/package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mcp-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy PS-Wiki MCP Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install and verify
        working-directory: worker
        run: |
          npm ci
          npm run check
          npx wrangler deploy --config wrangler-mcp.toml --dry-run

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler-mcp.toml
          workingDirectory: worker
          wranglerVersion: "4"
