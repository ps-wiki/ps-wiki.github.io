name: 🚀 Feature request
description: Propose a feature for this project
labels: ["needs triage", "enhancement"]
body:
  - type: markdown
    attributes:
      value: >
        Before you go any further, are you sure that this feature is not already implemented?
        If this is a usage question, please read the [README](https://github.com/ps-wiki/ps-wiki.github.io/blob/main/README.md) and the docs first.

  - type: checkboxes
    id: requirements
    attributes:
      label: Have you checked that your feature request isn't already filed?
      description: >
        Please check whether somebody else has already filed the same feature request.
      options:
        - label: I searched the wiki docs and past issues, none of which addressed my feature request.
          required: true
        - label: Yes, I have checked that this feature request isn't already filed.
          required: true

  - type: textarea
    attributes:
      label: Description & Motivation
      description: A clear and concise description of the 🚀 feature proposal
      placeholder: |
        Please outline the motivation for the proposal.
        Is your feature request related to a problem? e.g., I'm always frustrated when [...].
        If this is related to another GitHub issue, please link it here

  - type: textarea
    attributes:
      label: Pitch
      description: A clear and concise description of what you want to happen.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Alternatives
      description: A clear and concise description of any alternative solutions or features you've considered, if any.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false
